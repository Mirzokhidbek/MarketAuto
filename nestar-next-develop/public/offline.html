<!doctype html>
<html lang="uz">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#015DEA" />
		<title>CarPort — internet yoʻq</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				box-sizing: border-box;
				font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				background: #f6f7f9;
				color: #10213c;
				text-align: center;
			}
			main {
				max-width: 420px;
			}
			img {
				width: 200px;
				height: auto;
			}
			h1 {
				margin: 24px 0 8px;
				font-size: 22px;
			}
			p {
				margin: 0 0 6px;
				color: #5b6475;
				line-height: 1.5;
			}
			button {
				margin-top: 20px;
				padding: 12px 24px;
				border: 0;
				border-radius: 10px;
				background: #015dea;
				color: #fff;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/img/logo/logo.png" alt="CarPort" />
			<h1>Internet aloqasi yoʻq</h1>
			<p>Aloqa tiklangach sahifani yangilang.</p>
			<p lang="ru">Нет подключения к интернету. Обновите страницу, когда связь восстановится.</p>
			<p lang="en">You are offline. Reload the page when the connection is back.</p>
			<button type="button" onclick="location.reload()">Qayta urinish · Обновить · Retry</button>
		</main>
	</body>
</html>
