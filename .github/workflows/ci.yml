name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_DEV: mongodb://localhost:27017/marketauto_ci
      SECRET_TOKEN: ci-secret
      PORT_API: 3007
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx nest build nestar-api && npx nest build nestar-batch
      # start the API and run the end-to-end API checks against it
      - run: node dist/apps/nestar-api/main & npx wait-on -t 60000 tcp:3007
      - run: npm run test:api
        env:
          MONGO_URL: mongodb://localhost:27017/marketauto_ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestar-next-develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:3007
          REACT_APP_API_GRAPHQL_URL: http://localhost:3007/graphql
          REACT_APP_API_WS: ws://localhost:3007
